[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "short-drama-continuity-agent"
version = "0.1.0"
description = "Evidence-backed continuity review for short dramas, with human verification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0.0",
  "opencv-python-headless>=4.8.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
api = ["openai>=1.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
continuity-agent = "continuity_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
